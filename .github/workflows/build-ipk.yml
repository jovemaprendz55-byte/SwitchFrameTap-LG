name: Build webOS IPK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install webOS TV CLI
        run: npm install --global @webos-tools/cli
      - name: Generate valid PNG icons (Python standard library only)
        run: |
          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xffffffff)

          def make_png(path, size):
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      margin = max(2, size // 16)
                      inside = margin <= x < size-margin and margin <= y < size-margin
                      if inside:
                          pixel = (109, 93, 252, 255)
                      else:
                          pixel = (18, 27, 48, 255)
                      row.extend(pixel)
                  rows.append(bytes(row))
              raw = b"".join(rows)
              png = (b"\x89PNG\r\n\x1a\n"
                     + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
                     + chunk(b"IDAT", zlib.compress(raw, 9))
                     + chunk(b"IEND", b""))
              Path(path).write_bytes(png)

          app = Path("app")
          app.mkdir(exist_ok=True)
          make_png(app / "icon.png", 80)
          make_png(app / "largeIcon.png", 130)
          print("Generated:", *[str(p) for p in sorted(app.glob("*.png"))])
          PY
      - name: Verify app package inputs
        run: |
          test -f app/appinfo.json
          test -f app/index.html
          test -f app/icon.png
          test -f app/largeIcon.png
          python3 -m json.tool app/appinfo.json
          file app/icon.png app/largeIcon.png
          ls -la app
      - name: Package webOS application
        run: |
          mkdir -p dist
          ares-package app --outdir dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.ipk' -print -quit)"
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: switch-frame-tap-lg-ipk
          path: dist/*.ipk
          if-no-files-found: error
